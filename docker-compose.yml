services:
  db:
    image: mysql:8.4
    container_name: mysql_streetfighter
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: streetfighter
      MYSQL_USER: usuario
      MYSQL_PASSWORD: userpass
    ports:
      - "3307:3306"
    volumes:
      - datos_mysql:/var/lib/mysql
      - ./sql:/docker-entrypoint-initdb.d

volumes:
  datos_mysql: